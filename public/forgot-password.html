<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | AlphaVerse Construction</title>
  <link rel="stylesheet" href="/css/site.css"><script src="/js/site.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header"><a class="brand" href="/">AlphaVerse <span>Construction</span></a><a class="back-link" href="/login.html">← Back to sign in</a></header>
  <main class="auth-main auth-main-centered">
    <section class="form-card auth-card">
      <p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password</h1>
      <p>Request a one-time code, then choose a new password. Codes expire in 10 minutes.</p>
      <form id="password-reset-request">
        <div class="form-message" role="status" aria-live="polite"></div>
        <label>Email address<input name="email" id="reset-email" type="email" autocomplete="email" required maxlength="254"></label>
        <button class="button button-primary button-wide" type="submit">Send reset code <span>→</span></button>
      </form>
      <form id="password-reset-complete" hidden>
        <label>Reset code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000"></label>
        <label>New password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
        <button class="button button-primary button-wide" type="submit">Set new password <span>→</span></button>
      </form>
    </section>
  </main>
  <footer class="site-footer"><a href="/privacy.html">Privacy</a><small>© 2026 AlphaVerse Construction Services</small></footer>
</body>
</html>

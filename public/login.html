<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | AlphaVerse Construction</title>
  <link rel="stylesheet" href="/css/site.css"><script src="/js/site.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header"><a class="brand" href="/">AlphaVerse <span>Construction</span></a><a class="back-link" href="/">← Back to website</a></header>
  <main class="auth-main">
    <section class="auth-intro"><p class="eyebrow">ALPHAVERSE CLIENT PORTAL</p><h1>Good work starts with a clear plan.</h1><p>Sign in to manage your projects, inquiries, and account.</p></section>
    <form class="form-card auth-card" id="login-form"><p class="eyebrow">WELCOME BACK</p><h2>Sign in</h2><div class="form-message" role="status" aria-live="polite"></div>
      <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Your password"></label>
      <button class="button button-primary button-wide" type="submit">Sign in <span>→</span></button>
      <p class="auth-switch"><a href="/forgot-password.html">Forgot your password?</a></p>
      <p class="auth-switch">New to AlphaVerse? <a href="/register.html">Create an account</a></p>
    </form>
  </main>
  <footer class="site-footer"><a href="/privacy.html">Privacy</a><small>© 2026 AlphaVerse Construction Services</small></footer>
</body>
</html>
